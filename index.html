
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>贪吃蛇 · 加强版</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f1a;
      --panel: #1a1a2e;
      --panel-2: #20203a;
      --line: #2d2d55;
      --text: #f4f5ff;
      --muted: #9aa0c8;
      --green: #63e45c;
      --cyan: #55d6ff;
      --yellow: #ffd166;
      --red: #ff5d73;
      --purple: #a88bff;
    }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      background: radial-gradient(circle at top, #17172a 0%, #0f0f1a 52%, #080811 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .game-wrapper {
      width: min(94vw, 574px);
      background: linear-gradient(180deg, #1b1b31 0%, #17172a 100%);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 22px;
      padding: 20px 24px 24px;
      box-shadow: 0 18px 55px rgba(0,0,0,.55);
      position: relative;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 850;
      font-size: 21px;
      letter-spacing: .2px;
    }
    .brand .logo { font-size: 23px; filter: drop-shadow(0 0 8px rgba(72, 255, 186, .45)); }
    .scores { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 14px; }
    .scores strong { color: var(--yellow); font-size: 17px; margin-left: 4px; }
    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .hud .left { justify-self: start; color: #a7ff9c; font-weight: 700; }
    .hud .mid { justify-self: center; color: var(--red); font-weight: 800; }
    .hud .right { justify-self: end; color: var(--cyan); font-weight: 800; }
    .board-wrap { position: relative; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #17172a;
      border: 2px dashed rgba(85, 214, 255, .11);
      border-radius: 12px;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: rgba(10, 10, 20, .78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(5px);
      z-index: 2;
    }
    .overlay.show { display: flex; }
    .overlay-card {
      width: min(92%, 390px);
      max-height: 94%;
      overflow: auto;
      background: rgba(26, 26, 46, .96);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 22px 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
    }
    .overlay-card h2 { font-size: 24px; margin-bottom: 10px; }
    .overlay-card p { color: var(--muted); line-height: 1.65; margin-bottom: 16px; font-size: 14px; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .legend span { padding: 5px 8px; background: rgba(255,255,255,.05); border-radius: 99px; }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      border: 0;
      outline: 0;
      border-radius: 9px;
      background: #323258;
      color: var(--text);
      padding: 9px 18px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .12s ease, background .12s ease, opacity .12s ease;
      font-family: inherit;
    }
    .btn:hover { background: #414170; transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    .btn-primary { background: linear-gradient(135deg, #30d66a, #32b6ff); color: #07101a; }
    .btn-primary:hover { background: linear-gradient(135deg, #59e982, #57c7ff); }
    .controls-row { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    .mobile-controls { display: none; margin-top: 16px; justify-content: center; grid-template-columns: 46px 46px 46px; grid-template-rows: 46px 46px 46px; gap: 8px; }
    .mobile-controls .ctrl { width: 46px; height: 46px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: #242444; color: var(--text); font-size: 18px; font-weight: 900; }
    .mobile-controls .up { grid-column: 2; grid-row: 1; }
    .mobile-controls .left { grid-column: 1; grid-row: 2; }
    .mobile-controls .down { grid-column: 2; grid-row: 2; }
    .mobile-controls .right { grid-column: 3; grid-row: 2; }
    .lb-section { display: none; margin-top: 16px; border-top: 1px solid rgba(255,255,255,.09); padding-top: 14px; }
    .name-input-wrap { display: flex; gap: 8px; margin-bottom: 9px; }
    #nameInput { flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.12); background: #111124; color: var(--text); border-radius: 9px; padding: 9px 10px; outline: none; font-family: inherit; }
    #nameInput:focus { border-color: rgba(85, 214, 255, .75); }
    .lb-status { min-height: 22px; color: var(--muted); font-size: 13px; margin: 5px 0 9px; }
    .lb-title { font-weight: 850; margin: 8px 0; text-align: left; }
    .lb-table-wrap { max-height: 210px; overflow: auto; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; }
    .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lb-table th, .lb-table td { padding: 8px 7px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.06); }
    .lb-table th { color: var(--muted); font-weight: 700; position: sticky; top: 0; background: #1b1b31; }
    .lb-table td:nth-child(1), .lb-table th:nth-child(1) { width: 42px; text-align: center; }
    .lb-table td:nth-child(3), .lb-table th:nth-child(3), .lb-table td:nth-child(4), .lb-table th:nth-child(4) { text-align: center; }
    .current-player { background: rgba(255, 209, 102, .13); color: #fff1bd; }
    .lb-your-rank { margin-top: 8px; color: var(--yellow); font-size: 13px; min-height: 18px; }
    @media (max-width: 560px) {
      body { padding: 8px; align-items: flex-start; }
      .game-wrapper { padding: 14px; border-radius: 18px; }
      .topbar { align-items: flex-start; }
      .brand { font-size: 18px; }
      .scores { flex-direction: column; align-items: flex-end; gap: 4px; }
      .mobile-controls { display: grid; }
      .overlay-card { padding: 18px 14px; }
    }
  </style>
</head>
<body>
  <main class="game-wrapper" aria-label="贪吃蛇游戏">
    <section class="topbar">
      <div class="brand"><span class="logo">🐍</span><span>贪吃蛇+</span></div>
      <div class="scores">
        <span>得分 <strong id="scoreEl">0</strong></span>
        <span>最高 <strong id="bestEl">0</strong></span>
      </div>
    </section>

    <section class="hud">
      <div class="left" id="levelEl">Lv.1</div>
      <div class="mid" id="comboEl">🔥 0</div>
      <div class="right" id="statusEl">💎 无</div>
    </section>

    <section class="board-wrap">
      <canvas id="gameCanvas" width="504" height="504"></canvas>
      <div class="overlay show" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">🐍 贪吃蛇+</h2>
          <p id="overlayText">方向键 / WASD 控制<br>空格暂停 · R 重开 · 穿墙循环</p>
          <div class="legend">
            <span>🍎 +1分</span>
            <span>⭐ +3分</span>
            <span>☠️ -1分并缩短</span>
            <span>🛡️ 护盾</span>
            <span>⬛ 障碍</span>
          </div>
          <button class="btn btn-primary" id="startBtn">开始游戏</button>

          <div class="lb-section" id="lbSection">
            <div class="name-input-wrap">
              <input type="text" id="nameInput" placeholder="输入名字" maxlength="10" autocomplete="off" />
              <button class="btn btn-primary submit-btn" id="submitBtn">上传成绩</button>
            </div>
            <div class="lb-status" id="lbStatus">游戏结束后上传成绩</div>
            <div class="lb-title">排行榜</div>
            <div class="lb-table-wrap">
              <table class="lb-table">
                <thead><tr><th>#</th><th>玩家</th><th>得分</th><th>等级</th></tr></thead>
                <tbody id="lbBody"></tbody>
              </table>
            </div>
            <div id="lbYourRank" class="lb-your-rank"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="controls-row">
      <button class="btn" id="pauseBtn">暂停</button>
      <button class="btn" id="resetBtn">重新开始</button>
    </section>

    <section class="mobile-controls" aria-label="移动端方向键">
      <button class="ctrl up" data-dir="up">▲</button>
      <button class="ctrl left" data-dir="left">◀</button>
      <button class="ctrl down" data-dir="down">▼</button>
      <button class="ctrl right" data-dir="right">▶</button>
    </section>
  </main>

  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const bestEl = document.getElementById('bestEl');
    const levelEl = document.getElementById('levelEl');
    const comboEl = document.getElementById('comboEl');
    const statusEl = document.getElementById('statusEl');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const lbSection = document.getElementById('lbSection');
    const nameInput = document.getElementById('nameInput');
    const submitBtn = document.getElementById('submitBtn');
    const lbStatus = document.getElementById('lbStatus');
    const lbBody = document.getElementById('lbBody');
    const lbYourRank = document.getElementById('lbYourRank');

    const SUPABASE_URL = 'https://btamsdkkxqocnlneaofk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3q_i_8APJiz_qCRXfdHDVg_kj53nNPh';
    const SUPABASE_TABLE = 'snake_scores';

    const GRID = 28;
    const CELL = 18;
    const SIZE = GRID * CELL;
    const TYPES = {
      FOOD: 'food', STAR: 'star', POISON: 'poison', SHIELD: 'shield', BOOST: 'boost'
    };

    let snake;
    let dir;
    let nextDir;
    let food;
    let special;
    let obstacles;
    let score;
    let level;
    let combo;
    let maxCombo;
    let shield;
    let boostUntil;
    let best = Number(localStorage.getItem('snake_best') || 0);
    let globalBest = 0;
    let state = 'idle'; // idle | countdown | running | paused | over | won | error
    let countdownStart = 0;
    let lastFrame = 0;
    let accumulator = 0;
    let rafId = 0;
    let submitted = false;
    let playerName = localStorage.getItem('snake_player_name') || '';
    let lbCache = [];
    let touchStartX = null;
    let touchStartY = null;

    canvas.width = SIZE;
    canvas.height = SIZE;
    if (playerName) nameInput.value = playerName;

    function randInt(n) { return Math.floor(Math.random() * n); }
    function sameCell(a, b) { return a && b && a.x === b.x && a.y === b.y; }
    function keyOf(c) { return c.x + ',' + c.y; }
    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = String(s == null ? '' : s);
      return d.innerHTML;
    }

    function occupiedSet(extra = []) {
      const set = new Set();
      for (const p of snake) set.add(keyOf(p));
      for (const p of obstacles) set.add(keyOf(p));
      if (food) set.add(keyOf(food));
      if (special) set.add(keyOf(special));
      for (const p of extra) set.add(keyOf(p));
      return set;
    }

    function randomFreeCell(extra = []) {
      const blocked = occupiedSet(extra);
      for (let i = 0; i < 2000; i++) {
        const c = { x: randInt(GRID), y: randInt(GRID) };
        if (!blocked.has(keyOf(c))) return c;
      }
      for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
          const c = { x, y };
          if (!blocked.has(keyOf(c))) return c;
        }
      }
      return null;
    }

    function resetGameModel() {
      const cy = Math.floor(GRID / 2);
      snake = [
        { x: 7, y: cy }, { x: 6, y: cy }, { x: 5, y: cy }, { x: 4, y: cy }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      obstacles = [];
      food = null;
      special = null;
      score = 0;
      level = 1;
      combo = 0;
      maxCombo = 0;
      shield = 0;
      boostUntil = 0;
      submitted = false;
      accumulator = 0;
      spawnFood();
      rebuildObstacles();
      updateHud();
    }

    function spawnFood() {
      food = randomFreeCell();
      if (!food) finishWin();
    }

    function maybeSpawnSpecial(now) {
      if (special || Math.random() > 0.26) return;
      const c = randomFreeCell();
      if (!c) return;
      const r = Math.random();
      let type = TYPES.STAR;
      if (r < 0.38) type = TYPES.STAR;
      else if (r < 0.62) type = TYPES.POISON;
      else if (r < 0.82) type = TYPES.SHIELD;
      else type = TYPES.BOOST;
      special = { ...c, type, expiresAt: now + 8000 };
    }

    function rebuildObstacles() {
      const target = Math.min(24, Math.max(0, Math.floor((level - 1) * 1.65)));
      while (obstacles.length > target) obstacles.pop();
      while (obstacles.length < target) {
        const c = randomFreeCell([{ x: snake[0].x + dir.x, y: snake[0].y + dir.y }]);
        if (!c) break;
        const nearHead = Math.abs(c.x - snake[0].x) + Math.abs(c.y - snake[0].y) < 4;
        if (!nearHead) obstacles.push(c);
      }
    }

    function updateLevel() {
      const newLevel = Math.floor(score / 10) + 1;
      if (newLevel !== level) {
        level = newLevel;
        rebuildObstacles();
      }
    }

    function currentStepMs() {
      const base = Math.max(72, 168 - (level - 1) * 9);
      return isBoostActive() ? Math.max(54, base * 0.62) : base;
    }

    function isBoostActive() { return performance.now() < boostUntil; }

    function setDirection(dx, dy) {
      if ((state !== 'running' && state !== 'paused') || !dx && !dy) return;
      if (snake.length > 1 && dx === -dir.x && dy === -dir.y) return;
      nextDir = { x: dx, y: dy };
    }

    function cellIndex(list, cell) { return list.findIndex(p => sameCell(p, cell)); }

    function saveBest() {
      if (score > best) {
        best = score;
        localStorage.setItem('snake_best', String(best));
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = Math.max(best, globalBest);
      levelEl.textContent = 'Lv.' + level;
      comboEl.textContent = '🔥 ' + combo;
      const parts = [];
      if (shield > 0) parts.push('🛡️ ' + shield);
      if (isBoostActive()) parts.push('⚡ 加速');
      statusEl.textContent = parts.length ? parts.join('  ') : '💎 无';
    }

    function stepGame(now) {
      if (state !== 'running') return;
      if (special && now > special.expiresAt) special = null;

      dir = nextDir;
      const head = {
        x: (snake[0].x + dir.x + GRID) % GRID,
        y: (snake[0].y + dir.y + GRID) % GRID
      };

      const selfHit = cellIndex(snake, head);
      const obstacleHit = cellIndex(obstacles, head);
      if (selfHit > 0) {
        if (shield > 0) {
          shield--;
          snake = snake.slice(0, selfHit);
          snake.unshift(head);
          while (snake.length < 3) snake.push({ ...snake[snake.length - 1] });
        } else {
          return finishGame();
        }
      } else if (obstacleHit >= 0) {
        if (shield > 0) {
          shield--;
          obstacles.splice(obstacleHit, 1);
          snake.unshift(head);
          snake.pop();
        } else {
          return finishGame();
        }
      } else {
        snake.unshift(head);
      }

      let grow = false;
      if (sameCell(head, food)) {
        score += 1;
        combo += 1;
        maxCombo = Math.max(maxCombo, combo);
        grow = true;
        spawnFood();
        maybeSpawnSpecial(now);
      }

      if (special && sameCell(head, special)) {
        switch (special.type) {
          case TYPES.STAR:
            score += 3;
            combo += 3;
            maxCombo = Math.max(maxCombo, combo);
            grow = true;
            break;
          case TYPES.POISON:
            score = Math.max(0, score - 1);
            combo = 0;
            if (snake.length > 4) snake.pop();
            if (snake.length > 4) snake.pop();
            break;
          case TYPES.SHIELD:
            shield = clamp(shield + 1, 0, 3);
            break;
          case TYPES.BOOST:
            boostUntil = now + 6200;
            break;
        }
        special = null;
      }

      if (!grow) snake.pop();
      updateLevel();
      saveBest();
      updateHud();

      const freeCells = GRID * GRID - obstacles.length;
      if (snake.length >= freeCells - 1) finishWin();
    }

    function finishGame() {
      if (state === 'over') return;
      state = 'over';
      saveBest();
      updateHud();
      submitted = false;
      submitBtn.disabled = false;
      submitBtn.textContent = '上传成绩';
      lbStatus.textContent = score > 0 ? '可以上传本局成绩' : '0 分无须上传';
      showOverlay('💀 游戏结束', `得分：${score} | 最高连击：${maxCombo}<br>速度等级：${level}<br>蛇身长度：${snake.length}`, true, '再玩一次');
      if (playerName) nameInput.value = playerName;
      renderLeaderboard(lbCache);
      loadLeaderboard();
    }

    function finishWin() {
      if (state === 'won') return;
      state = 'won';
      saveBest();
      updateHud();
      submitted = false;
      submitBtn.disabled = false;
      submitBtn.textContent = '上传成绩';
      lbStatus.textContent = '通关成绩可上传';
      showOverlay('🎉 通关成功', `得分：${score} | 最高连击：${maxCombo}<br>速度等级：${level}<br>蛇身长度：${snake.length}`, true, '再玩一次');
      renderLeaderboard(lbCache);
      loadLeaderboard();
    }

    function finishError(err) {
      state = 'error';
      console.error('[snake-game-plus] 游戏异常：', err);
      showOverlay('⚠️ 游戏异常', '游戏循环遇到异常。请点击重新开始，或刷新页面。', false, '重新开始');
    }

    function showOverlay(title, text, showLb, buttonText) {
      overlayTitle.innerHTML = title;
      overlayText.innerHTML = text;
      startBtn.textContent = buttonText || '开始游戏';
      startBtn.style.display = '';
      lbSection.style.display = showLb ? '' : 'none';
      overlay.classList.add('show');
    }

    function hideOverlay() { overlay.classList.remove('show'); }

    function startGame() {
      resetGameModel();
      state = 'countdown';
      countdownStart = performance.now();
      lastFrame = performance.now();
      accumulator = 0;
      pauseBtn.textContent = '暂停';
      lbSection.style.display = 'none';
      hideOverlay();
      updateHud();
    }

    function togglePause() {
      if (state === 'running') {
        state = 'paused';
        pauseBtn.textContent = '继续';
        showOverlay('⏸️ 已暂停', '按空格、P 或点击继续返回游戏。', false, '继续');
      } else if (state === 'paused') {
        state = 'running';
        pauseBtn.textContent = '暂停';
        hideOverlay();
        accumulator = 0;
        lastFrame = performance.now();
      }
    }

    function restartGame() { startGame(); }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    function drawGrid() {
      ctx.fillStyle = '#161629';
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.strokeStyle = 'rgba(85, 214, 255, .035)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        const p = i * CELL + .5;
        ctx.beginPath();
        ctx.moveTo(p, 0); ctx.lineTo(p, SIZE); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, p); ctx.lineTo(SIZE, p); ctx.stroke();
      }
    }

    function drawCell(cell, color, inset = 2, radius = 5) {
      ctx.fillStyle = color;
      drawRoundedRect(cell.x * CELL + inset, cell.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, radius);
    }

    function drawFood() {
      if (food) {
        drawCell(food, '#ffd166', 3, 7);
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * .27, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!special) return;
      const centerX = special.x * CELL + CELL / 2;
      const centerY = special.y * CELL + CELL / 2;
      const map = {
        [TYPES.STAR]: ['#ffd166', '⭐'],
        [TYPES.POISON]: ['#ff5d73', '☠'],
        [TYPES.SHIELD]: ['#55d6ff', '◆'],
        [TYPES.BOOST]: ['#ff9f1c', '⚡']
      };
      const [color, label] = map[special.type];
      drawCell(special, color, 2, 7);
      ctx.fillStyle = '#101018';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, centerX, centerY + 1);
    }

    function drawObstacles() {
      for (const o of obstacles) drawCell(o, '#34344f', 1.5, 4);
    }

    function drawSnake() {
      snake.forEach((p, i) => {
        const t = i / Math.max(1, snake.length - 1);
        const hue = 158 - t * 80;
        ctx.fillStyle = `hsl(${hue} 70% ${55 - t * 8}%)`;
        drawRoundedRect(p.x * CELL + 2, p.y * CELL + 2, CELL - 4, CELL - 4, 5);
        if (i === 0) {
          ctx.fillStyle = '#1b1b31';
          const eyeY = p.y * CELL + 6;
          const eyeOffsetX = dir.x !== 0 ? 0 : 3;
          const eyeOffsetY = dir.y !== 0 ? 0 : 3;
          ctx.beginPath(); ctx.arc(p.x * CELL + 6 + eyeOffsetX * dir.x, eyeY + eyeOffsetY * dir.y, 1.7, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(p.x * CELL + 12 + eyeOffsetX * dir.x, eyeY + eyeOffsetY * dir.y, 1.7, 0, Math.PI * 2); ctx.fill();
        }
      });
    }

    function drawCountdown(now) {
      if (state !== 'countdown') return;
      const elapsed = now - countdownStart;
      let text = '';
      if (elapsed < 600) text = '3';
      else if (elapsed < 1200) text = '2';
      else if (elapsed < 1800) text = '1';
      else if (elapsed < 2300) text = '开始!';
      else {
        state = 'running';
        lastFrame = now;
        accumulator = 0;
        return;
      }
      ctx.fillStyle = 'rgba(0,0,0,.38)';
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.fillStyle = '#fff';
      ctx.font = '900 78px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255,255,255,.36)';
      ctx.shadowBlur = 24;
      ctx.fillText(text, SIZE / 2, SIZE / 2);
      ctx.shadowBlur = 0;
    }

    function draw() {
      drawGrid();
      drawObstacles();
      drawFood();
      drawSnake();
    }

    function loop(now) {
      try {
        if (!lastFrame) lastFrame = now;
        const rawDt = now - lastFrame;
        const dt = Math.min(rawDt, 250);
        lastFrame = now;

        if (state === 'running') {
          accumulator += dt;
          const stepMs = currentStepMs();
          let guard = 0;
          while (accumulator >= stepMs && state === 'running' && guard < 5) {
            stepGame(now);
            accumulator -= stepMs;
            guard++;
          }
        }

        draw();
        if (state === 'countdown') drawCountdown(now);
        updateHud();
      } catch (err) {
        finishError(err);
      }
      rafId = requestAnimationFrame(loop);
    }

    function loadLeaderboard() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
      const select = 'player_name,score,lvl,created_at';
      fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=${select}&order=score.desc.nullslast,created_at.asc&limit=80`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      })
      .then(r => { if (!r.ok) throw new Error('load leaderboard failed'); return r.json(); })
      .then(data => {
        lbCache = Array.isArray(data) ? data : [];
        if (lbCache[0] && Number(lbCache[0].score) > globalBest) {
          globalBest = Number(lbCache[0].score);
        }
        renderLeaderboard(lbCache);
        updateHud();
      })
      .catch(() => {
        if (lbSection.style.display !== 'none') lbStatus.innerHTML = '<span style="color:#9090b8">暂时无法读取排行榜</span>';
      });
    }

    function renderLeaderboard(data) {
      lbBody.innerHTML = '';
      if (!data || data.length === 0) {
        lbStatus.innerHTML = '<span style="color:#9090b8">暂无成绩</span>';
        lbYourRank.textContent = '';
        return;
      }
      const seen = new Set();
      let rank = -1;
      let displayRank = 0;
      for (const item of data) {
        const name = String(item.player_name || '匿名玩家').slice(0, 16);
        if (seen.has(name)) continue;
        seen.add(name);
        displayRank++;
        const tr = document.createElement('tr');
        if (name === playerName) {
          tr.classList.add('current-player');
          rank = displayRank;
        }
        tr.innerHTML = `<td>${displayRank}</td><td title="${escapeHtml(name)}">${escapeHtml(name)}</td><td>${Number(item.score) || 0}</td><td>Lv.${Number(item.lvl) || 1}</td>`;
        lbBody.appendChild(tr);
        if (displayRank >= 50) break;
      }
      lbStatus.textContent = state === 'over' || state === 'won' ? (score > 0 ? '可以上传本局成绩' : '0 分无须上传') : '排行榜已加载';
      if (rank > 0) lbYourRank.textContent = `⭐ 你的排名：第 ${rank} 名`;
      else if (playerName) lbYourRank.textContent = '未上榜，上传成绩试试';
      else lbYourRank.textContent = '';
    }

    function submitScore() {
      const name = nameInput.value.trim().slice(0, 10);
      if (state !== 'over' && state !== 'won') {
        lbStatus.textContent = '游戏结束后才能上传成绩';
        return;
      }
      if (!name) {
        lbStatus.textContent = '请输入名字';
        nameInput.focus();
        return;
      }
      if (submitted) {
        lbStatus.textContent = '已上传本局成绩';
        return;
      }
      if (score <= 0) {
        lbStatus.textContent = '0 分无须上传';
        return;
      }
      const lastSubmit = Number(localStorage.getItem('snake_last_submit') || 0);
      const cooldown = 15000;
      const wait = cooldown - (Date.now() - lastSubmit);
      if (wait > 0) {
        lbStatus.textContent = `请 ${Math.ceil(wait / 1000)} 秒后再试`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '上传中...';
      playerName = name;
      localStorage.setItem('snake_player_name', playerName);

      fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          Prefer: 'return=minimal'
        },
        body: JSON.stringify({
          player_name: playerName,
          score,
          combo: maxCombo,
          lvl: level,
          snake_length: snake.length
        })
      })
      .then(r => { if (!r.ok) throw new Error('submit score failed'); })
      .then(() => {
        submitted = true;
        localStorage.setItem('snake_last_submit', String(Date.now()));
        submitBtn.textContent = '已上传 ✓';
        submitBtn.disabled = true;
        lbStatus.textContent = '✅ 成绩已记录！';
        loadLeaderboard();
      })
      .catch(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = '上传失败，重试';
        lbStatus.textContent = '网络错误或数据库策略未开启，请稍后重试';
      });
    }

    document.addEventListener('keydown', e => {
      const k = e.key;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D',' ','Enter'].includes(k)) e.preventDefault();
      if (k === ' ' || k === 'p' || k === 'P') { togglePause(); return; }
      if (k === 'r' || k === 'R') { restartGame(); return; }
      if (k === 'Enter' && overlay.classList.contains('show')) { startGame(); return; }
      switch (k) {
        case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;
      }
    });

    document.querySelectorAll('[data-dir]').forEach(btn => {
      const handle = e => {
        e.preventDefault();
        const d = btn.dataset.dir;
        if (d === 'up') setDirection(0, -1);
        else if (d === 'down') setDirection(0, 1);
        else if (d === 'left') setDirection(-1, 0);
        else if (d === 'right') setDirection(1, 0);
      };
      btn.addEventListener('touchstart', handle, { passive: false });
      btn.addEventListener('mousedown', handle);
    });

    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });
    canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchend', e => {
      if (touchStartX == null || touchStartY == null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      touchStartX = null;
      touchStartY = null;
      if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
      if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
      else setDirection(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    startBtn.addEventListener('click', () => {
      if (state === 'paused') togglePause();
      else startGame();
    });
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', restartGame);
    submitBtn.addEventListener('click', submitScore);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitScore(); });

    resetGameModel();
    showOverlay('🐍 贪吃蛇+', '方向键 / WASD 控制<br>空格暂停 · R 重开 · 穿墙循环', false, '开始游戏');
    draw();
    loadLeaderboard();
    rafId = requestAnimationFrame(loop);
    window.addEventListener('beforeunload', () => cancelAnimationFrame(rafId));
  })();
  </script>
</body>
</html>
