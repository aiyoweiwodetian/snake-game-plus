<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>贪吃蛇 · 加强版</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .game-wrapper {
    background: #1a1a2e;
    border-radius: 20px;
    padding: 20px 24px 24px;
    box-shadow: 0 12px 48px rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%;
  }
  .header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .title { color: #e0e0f0; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .score-box { display: flex; gap: 14px; }
  .score-box span { color: #8888b0; font-size: 13px; font-weight: 600; }
  .score-box em { font-style: normal; color: #f0e68c; font-size: 16px; font-weight: 700; min-width: 26px; display: inline-block; text-align: right; }
  .status-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #707098; }
  .status-bar .combo { color: #f09; font-weight: 700; transition: opacity .2s; }
  .status-bar .shield { color: #4fc3f7; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .status-bar .shield .shield-icon {
    display: inline-block; width: 14px; height: 14px; border-radius: 4px;
    background: #4fc3f7; transform: rotate(45deg); transition: box-shadow .3s;
  }
  .status-bar .shield .shield-icon.active {
    animation: shieldPulse .8s ease-in-out infinite; box-shadow: 0 0 8px #4fc3f7;
  }
  @keyframes shieldPulse {
    0%, 100% { box-shadow: 0 0 4px #4fc3f7; }
    50% { box-shadow: 0 0 14px #4fc3f7, 0 0 24px rgba(79,195,247,.4); }
  }
  .status-bar .level { color: #aed581; font-weight: 600; }
  canvas {
    display: block; background: #16162a; border-radius: 12px;
    width: 500px; height: 500px; image-rendering: pixelated; touch-action: none;
  }
  .controls { width: 100%; display: flex; justify-content: center; gap: 8px; }
  .btn {
    background: #2a2a44; border: none; color: #c0c0e0; font-size: 13px;
    font-weight: 600; padding: 7px 18px; border-radius: 8px; cursor: pointer;
    transition: background .15s, transform .1s; touch-action: manipulation;
  }
  .btn:hover { background: #3a3a5a; }
  .btn:active { transform: scale(.96); background: #4a4a6a; }
  .btn-primary { background: #3a6a4a; color: #d0f0d0; }
  .btn-primary:hover { background: #4a7a5a; }
  .dpad { display: none; grid-template: repeat(3, 50px) / repeat(3, 50px); gap: 4px; }
  .dpad button {
    background: #2a2a44; border: none; border-radius: 10px; color: #c0c0e0;
    font-size: 20px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .dpad button:active { background: #4a4a6a; }
  .dpad .blank { visibility: hidden; pointer-events: none; }
  .overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(22,22,42,.88); border-radius: 12px;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; pointer-events: none;
  }
  .overlay.show { display: flex; pointer-events: auto; }
  .overlay h2 { color: #f0e68c; font-size: 26px; letter-spacing: 2px; }
  .overlay p { color: #a0a0c8; font-size: 14px; text-align: center; line-height: 1.6; max-width: 360px; }
  .overlay .btn { margin-top: 8px; pointer-events: auto; }
  .overlay .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; margin: 4px 0; }
  .overlay .legend span { font-size: 12px; color: #9090b8; }
  .overlay .stats { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; margin: 2px 0; }
  .overlay .stats span { font-size: 13px; color: #a0a0c8; }
  .overlay .stats em { font-style: normal; color: #f0e68c; font-weight: 700; }
  .canvas-wrap { position: relative; }
  @media (pointer: coarse) { .dpad { display: grid; } }
  @media (max-width: 560px) {
    .game-wrapper { padding: 12px 12px 14px; border-radius: 14px; gap: 8px; }
    canvas { width: min(92vw, 500px); height: min(92vw, 500px); }
    .title { font-size: 16px; }
    .btn { font-size: 12px; padding: 6px 14px; }
    .status-bar { font-size: 12px; flex-wrap: wrap; gap: 4px; }
    .dpad { grid-template: repeat(3, 44px) / repeat(3, 44px); }
    .overlay h2 { font-size: 20px; }
    .overlay p { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <span class="title">🐍 贪吃蛇+</span>
    <div class="score-box">
      <span>得分 <em id="score">0</em></span>
      <span>最高 <em id="best">0</em></span>
    </div>
  </div>
  <div class="status-bar" id="statusBar">
    <span><span class="level" id="lvlDisplay">Lv.1</span></span>
    <span><span class="combo" id="comboDisplay">🔥 0</span></span>
    <span class="shield" id="shieldDisplay">
      <span class="shield-icon" id="shieldIcon"></span>
      <span id="shieldText">无</span>
    </span>
  </div>
  <div class="canvas-wrap">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="overlay show" id="overlay">
      <h2>🐍 贪吃蛇+</h2>
      <p>方向键 / WASD 控制<br>空格暂停 · R 重开 · 穿墙循环</p>
      <div class="legend">
        <span>🍎 +1分</span>
        <span>⭐ +3分</span>
        <span>☠️ -1分并缩短</span>
        <span>💠 护盾</span>
        <span>🧱 障碍</span>
      </div>
      <button class="btn btn-primary" id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="pauseBtn">暂停</button>
    <button class="btn" id="resetBtn">重新开始</button>
  </div>
  <div class="dpad" id="dpad">
    <button class="blank"></button>
    <button data-dir="up">▲</button>
    <button class="blank"></button>
    <button data-dir="left">◀</button>
    <button data-dir="down">▼</button>
    <button data-dir="right">▶</button>
  </div>
</div>
<script>
(()=>{
const G=25,S=500,C=S/G;
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),pauseBtn=document.getElementById('pauseBtn');
const comboEl=document.getElementById('comboDisplay'),lvlEl=document.getElementById('lvlDisplay');
const shieldText=document.getElementById('shieldText'),shieldIcon=document.getElementById('shieldIcon');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),resetBtn=document.getElementById('resetBtn');
let snake,food,obs,dir,ndir,sc,best,ate,combo,sp,lvl,go,pa,wn,shd,shi,parts,pops,aid,raf,cdAct,cdVal,run;
const MO=24,SI=10,OI=5,BS=150,MS=45;
function pop(x,y,t,c){pops.push({x:x*C+C/2,y:y*C+C/2,t,c,l:1,vy:-1.5})}
function upPops(){for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.y+=p.vy;p.l-=0.025;if(p.l<=0)pops.splice(i,1)}}
function drPops(){for(const p of pops){const s=p.l<0.3?p.l/0.3:1;ctx.save();ctx.globalAlpha=Math.max(0,p.l);ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.fillStyle=p.c;ctx.font='bold 18px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=p.c;ctx.shadowBlur=12;ctx.fillText(p.t,0,0);ctx.shadowBlur=0;ctx.restore();ctx.globalAlpha=1}}
function grid(){ctx.strokeStyle='#1e1e36';ctx.lineWidth=.5;for(let i=0;i<=G;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,S);ctx.moveTo(0,i*C);ctx.lineTo(S,i*C);ctx.stroke()}}
function drObs(){for(const o of obs){const x=o.x*C,y=o.y*C;ctx.fillStyle='#2a2a3e';ctx.fillRect(x+1,y+1,C-2,C-2);ctx.strokeStyle='#4a4a6a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+2,y+2);ctx.lineTo(x+C-2,y+C-2);ctx.moveTo(x+C-2,y+2);ctx.lineTo(x+2,y+C-2);ctx.stroke()}}
function drShi(){if(!shi)return;const cx=shi.x*C+C/2,cy=shi.y*C+C/2,p=.85+.15*Math.sin(Date.now()/200);ctx.save();ctx.translate(cx,cy);ctx.scale(p,p);ctx.beginPath();ctx.moveTo(0,-C/2+2);ctx.lineTo(C/2-2,0);ctx.lineTo(0,C/2-2);ctx.lineTo(-C/2+2,0);ctx.closePath();ctx.fillStyle='#4fc3f7';ctx.shadowColor='#4fc3f7';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#b3e5fc';ctx.beginPath();ctx.moveTo(0,-C/4);ctx.lineTo(C/4,0);ctx.lineTo(0,C/4);ctx.lineTo(-C/4,0);ctx.closePath();ctx.fill();ctx.restore()}
function drFd(){if(!food)return;const cx=food.x*C+C/2,cy=food.y*C+C/2;if(food.t==='n'){ctx.fillStyle='#ff5a5a';ctx.beginPath();ctx.arc(cx,cy,C/2-2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8888';ctx.beginPath();ctx.arc(cx-2,cy-2,3,0,Math.PI*2);ctx.fill()}else if(food.t==='g'){const g2=.7+.3*Math.sin(Date.now()/180);ctx.save();ctx.shadowColor='#ffd700';ctx.shadowBlur=g2*14;ctx.fillStyle='#ffd700';const sk=5,ou=C/2-1,inn=ou*.4;ctx.beginPath();for(let i=0;i<sk*2;i++){const r=i%2===0?ou:inn,a=i*Math.PI/sk-Math.PI/2;const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore()}else if(food.t==='p'){ctx.fillStyle='#7b1fa2';ctx.beginPath();ctx.ellipse(cx,cy+2,C/2-2,C/3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9c27b0';ctx.beginPath();ctx.ellipse(cx,cy-3,C/2-3,C/3,0,Math.PI,0);ctx.fill();ctx.fillStyle='#ce93d8';ctx.beginPath();ctx.arc(cx-4,cy-4,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+3,cy-6,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+5,cy-2,2,0,Math.PI*2);ctx.fill()}}
function drSn(){const b=shd;for(let i=0;i<snake.length;i++){const s2=snake[i];const p=snake.length>1?i/(snake.length-1):0;ctx.fillStyle=`rgb(${60+p*40|0},${170+p*50|0},${60+(1-p)*70|0})`;const x=s2.x*C+1.5,y=s2.y*C+1.5,w=C-3,h=C-3;ctx.beginPath();ctx.roundRect(x,y,w,h,4);ctx.fill();if(b){ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.shadowColor='#4fc3f7';ctx.shadowBlur=8;ctx.beginPath();ctx.roundRect(x-.5,y-.5,w+1,h+1,5);ctx.stroke();ctx.shadowBlur=0}}if(snake.length>0){const hd=snake[0];ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hd.x*C+7,hd.y*C+7,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hd.x*C+C-7,hd.y*C+7,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(hd.x*C+7,hd.y*C+7,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hd.x*C+C-7,hd.y*C+7,1.2,0,Math.PI*2);ctx.fill()}}
function drEg(){ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#4fc3f7';ctx.lineWidth=1;ctx.setLineDash([8,4]);ctx.beginPath();ctx.moveTo(0,1);ctx.lineTo(S,1);ctx.stroke();ctx.beginPath();ctx.moveTo(0,S-1);ctx.lineTo(S,S-1);ctx.stroke();ctx.beginPath();ctx.moveTo(1,0);ctx.lineTo(1,S);ctx.stroke();ctx.beginPath();ctx.moveTo(S-1,0);ctx.lineTo(S-1,S);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
function drPa(){for(const p of parts){ctx.save();ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
function drPaO(){ctx.fillStyle='rgba(16,16,30,0.6)';ctx.fillRect(0,0,S,S);ctx.fillStyle='#e0e0f0';ctx.font='bold 36px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(255,255,255,0.15)';ctx.shadowBlur=16;ctx.fillText('\u23f8 \u5df2\u6682\u505c',S/2,S/2);ctx.shadowBlur=0;ctx.font='14px system-ui,sans-serif';ctx.fillStyle='#8888b0';ctx.fillText('\u6309 \u7a7a\u683c\u952e \u7ee7\u7eed',S/2,S/2+40)}
function draw(){if(cdAct)return;ctx.clearRect(0,0,S,S);grid();drObs();drShi();drFd();drSn();drPa();drPops();drEg();if(pa)drPaO()}
function eP(x,y,c,n){n=n||18;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sd=.8+Math.random()*1.6;parts.push({x:x*C+C/2,y:y*C+C/2,vx:Math.cos(a)*sd,vy:Math.sin(a)*sd,r:2+Math.random()*3,c:c,a:1,d:.015+Math.random()*.02})}}
function eDP(){snake.forEach(s2=>{for(let i=0;i<3;i++){const a=Math.random()*Math.PI*2,sd=1+Math.random()*2;parts.push({x:s2.x*C+C/2,y:s2.y*C+C/2,vx:Math.cos(a)*sd,vy:Math.sin(a)*sd,r:2+Math.random()*4,c:`hsl(${Math.random()*360|0},80%,60%)`,a:1,d:.008+Math.random()*.012})}})}
function eWP(){for(let i=0;i<120;i++){const a=Math.random()*Math.PI*2,sd=1+Math.random()*3;parts.push({x:Math.random()*S,y:Math.random()*S,vx:Math.cos(a)*sd,vy:Math.sin(a)*sd-1,r:2+Math.random()*4,c:`hsl(${Math.random()*360|0},90%,65%)`,a:1,d:.005+Math.random()*.01})}}
function upPa(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.a-=p.d;p.r*=.99;if(p.a<=0||p.r<.3)parts.splice(i,1)}}
function init(){const md=G/2|0;snake=[{x:md,y:md},{x:md-1,y:md},{x:md-2,y:md}];dir={x:1,y:0};ndir={x:1,y:0};sc=0;ate=0;combo=0;lvl=1;sp=BS;go=false;wn=false;pa=false;shd=false;run=false;cdAct=false;obs=[];shi=null;parts=[];pops=[];scoreEl.textContent='0';pauseBtn.textContent='\u6682\u505c';upSB();best=parseInt(localStorage.getItem('snake_best'))||0;bestEl.textContent=best;spFd();draw()}
function spFd(){const oc=new Set(snake.map(s=>s.x+','+s.y));obs.forEach(o=>oc.add(o.x+','+o.y));if(shi)oc.add(shi.x+','+shi.y);const fr=[];for(let x=0;x<G;x++)for(let y=0;y<G;y++)if(!oc.has(x+','+y))fr.push({x,y});if(fr.length===0){wn=true;food=null;return}const roll=Math.random();let t;if(roll<.10)t='p';else if(roll<.25)t='g';else t='n';const pos=fr[Math.random()*fr.length|0];food={...pos,t}}
function spSh(){if(shi)return;const oc=new Set(snake.map(s=>s.x+','+s.y));obs.forEach(o=>oc.add(o.x+','+o.y));if(food)oc.add(food.x+','+food.y);if(shi)oc.add(shi.x+','+shi.y);const fr=[];for(let x=0;x<G;x++)for(let y=0;y<G;y++)if(!oc.has(x+','+y))fr.push({x,y});if(fr.length===0)return;const pos=fr[Math.random()*fr.length|0];shi={x:pos.x,y:pos.y,timer:180}}
function spOb(){if(obs.length>=MO)return;const oc=new Set(snake.map(s=>s.x+','+s.y));obs.forEach(o=>oc.add(o.x+','+o.y));if(food)oc.add(food.x+','+food.y);if(shi)oc.add(shi.x+','+shi.y);const fr=[];for(let x=0;x<G;x++)for(let y=0;y<G;y++)if(!oc.has(x+','+y))fr.push({x,y});if(fr.length===0)return;obs.push(fr[Math.random()*fr.length|0])}
function step(){if(go||pa||wn||cdAct||!run)return;dir={...ndir};const hd=snake[0];let nx=hd.x+dir.x,ny=hd.y+dir.y;nx=((nx%G)+G)%G;ny=((ny%G)+G)%G;if(obs.some(o=>o.x===nx&&o.y===ny)){if(shd){shd=false;eP(nx,ny,'#4fc3f7',25);obs=obs.filter(o=>!(o.x===nx&&o.y===ny));upSB();aid=setTimeout(step,sp);return}else{eDP();eG();return}}if(snake.some(s=>s.x===nx&&s.y===ny)){if(shd){shd=false;eP(hd.x,hd.y,'#4fc3f7',25);upSB();aid=setTimeout(step,sp);return}else{eDP();eG();return}}if(shi&&nx===shi.x&&ny===shi.y){shd=true;shi=null;eP(nx,ny,'#4fc3f7',30);upSB()}snake.unshift({x:nx,y:ny});if(food&&nx===food.x&&ny===food.y){ate++;combo++;let as=0,fc='#ff5a5a',pt='+1';if(food.t==='n'){as=1;fc='#ff5a5a';pt='+1'}else if(food.t==='g'){as=3;fc='#ffd700';pt='+3'}else if(food.t==='p'){as=-1;fc='#9c27b0';pt='-1';if(snake.length>4)snake.splice(snake.length-3,3)}as+=(combo/3|0);sc+=as;if(sc<0)sc=0;scoreEl.textContent=sc;if(sc>best){best=sc;localStorage.setItem('snake_best',best);bestEl.textContent=best}pop(food.x,food.y,pt,fc);eP(food.x,food.y,fc,food.t==='g'?28:18);lvl=Math.min(10,(ate/5|0)+1);sp=Math.max(MS,BS-(lvl-1)*11);if(ate%OI===0)spOb();if(ate%SI===0)spSh();spFd();upSB();if(wn){go=true;eWP();sO('\ud83c\udf89 \u4f60\u8d62\u4e86\uff01','\u86c7\u5df2\u5360\u6ee1\u5168\u90e8\u683c\u5b50');return}}else{snake.pop()}if(shi){shi.timer--;if(shi.timer<=0){shi=null;upSB()}}draw();aid=setTimeout(step,sp)}
function eG(){go=true;run=false;sO('\ud83d\udc80 \u6e38\u620f\u7ed3\u675f',`\u5f97\u5206\uff1a${sc} \u2003|\u2003 \u6700\u9ad8\u8fde\u51fb\uff1a${combo}<br>\u901f\u5ea6\u7b49\u7ea7\uff1a${lvl} \u2003|\u2003 \u86c7\u8eab\u957f\u5ea6\uff1a${snake.length}`)}
function sO(t,s){overlay.querySelector('h2').innerHTML=t;overlay.querySelector('p').innerHTML=s||'';overlay.classList.add('show')}
function hO(){overlay.classList.remove('show');overlay.querySelector('h2').textContent='\ud83d\udc0d \u8d2a\u5403\u86c7+';overlay.querySelector('p').innerHTML='\u65b9\u5411\u952e / WASD \u63a7\u5236<br>\u7a7a\u683c\u6682\u505c \u00b7 R \u91cd\u5f00 \u00b7 \u7a7f\u5899\u5faa\u73af'}
function upSB(){comboEl.textContent=combo>0?'\ud83d\udd25 '+combo:'\ud83d\udd25 0';comboEl.style.opacity=combo>=3?'1':'0.5';if(shd){shieldText.textContent='\u6fc0\u6d3b';shieldIcon.classList.add('active')}else if(shi){shieldText.textContent='\u7b49\u5f85\u62fe\u53d6';shieldIcon.classList.remove('active')}else{shieldText.textContent='\u65e0';shieldIcon.classList.remove('active')}lvlEl.textContent='Lv.'+lvl}
function stG(){hO();clearTimeout(aid);init();pa=false;pauseBtn.textContent='\u6682\u505c';cdAct=true;cdVal=3;drCD('3');let n=2;const iv=setInterval(()=>{if(n>0){drCD(String(n));n--}else if(n===0){drCD('\u5f00\u59cb!');n=-1}else{clearInterval(iv);cdAct=false;run=true;aid=setTimeout(step,sp)}},450)}
function drCD(t){ctx.clearRect(0,0,S,S);grid();drObs();drShi();drFd();drSn();drPa();drPops();drEg();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,S,S);ctx.fillStyle='#fff';ctx.font='bold 80px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(255,255,255,0.25)';ctx.shadowBlur=30;ctx.fillText(t,S/2,S/2);ctx.shadowBlur=0}
function tP(){if(go||wn||cdAct||!run)return;pa=!pa;pauseBtn.textContent=pa?'\u7ee7\u7eed':'\u6682\u505c';draw();if(!pa)aid=setTimeout(step,sp)}
function rG(){clearTimeout(aid);hO();init();pa=false;run=false;cdAct=false;pauseBtn.textContent='\u6682\u505c'}
function sD(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;if(dx!==0||dy!==0)ndir={x:dx,y:dy}}
